name: Build NILLAN AUDIO PRO EQ APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bangun APK
        run: |
          cd NILLAN_AUDIO_PRO_EQ
          gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: NILLAN-AUDIO-PRO-EQ-APK
          path: NILLAN_AUDIO_PRO_EQ/app/build/outputs/apk/debug/*.apk
